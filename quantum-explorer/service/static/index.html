<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quantum Dogecoin Explorer</title>
  <meta name="theme-color" content="#0b0f14" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0f14;
      --bg2: #121922;
      --card: #161f2c;
      --text: #e9f0fa;
      --muted: #8a9bb3;
      --accent: #d4b84a;
      --doge: #f2cb2c;
      --border: #273447;
      --danger: #c44c4c;
      --ok: #3ecf8e;
      --sidebar-w: 260px;
      --input-bg: #0e141c;
    }
    .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; vertical-align: middle; }
    .icon-inline { font-size: 1.25rem !important; margin-right: 0.25rem; vertical-align: -0.25rem; }
    .btn-ico { font-size: 1.15rem !important; vertical-align: -0.2rem; margin-right: 0.15rem; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Comic Neue", "Comic Sans MS", "Segoe UI", cursive, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; }
    a { color: var(--doge); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: var(--sidebar-w); min-height: 100vh; position: sticky; top: 0; align-self: flex-start;
      background: linear-gradient(180deg, #121a26 0%, #0d1218 100%); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 0.65rem; padding: 1rem 0.85rem; border-bottom: 1px solid var(--border); }
    .sidebar-logo { width: 36px; height: 36px; border-radius: 10px; }
    .sidebar-titles { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .sidebar-name { font-weight: 700; font-size: 1.02rem; line-height: 1.2; }
    .sidebar-sub { font-size: 0.78rem; color: var(--muted); }
    .sidebar-nav { display: flex; flex-direction: column; padding: 0.5rem 0.35rem; gap: 0.15rem; flex: 1; }
    .nav-item {
      display: flex; align-items: center; gap: 0.5rem; width: 100%; text-align: left;
      border: none; background: transparent; color: var(--text); font: inherit; cursor: pointer;
      border-radius: 10px; padding: 0.55rem 0.65rem; transition: background 0.15s;
    }
    .nav-item:hover, .nav-item:focus-visible { background: rgba(212, 184, 74, 0.12); outline: none; }
    .nav-item.active { background: rgba(212, 184, 74, 0.2); color: var(--doge); }
    .nav-ico { font-size: 1.35rem !important; opacity: 0.95; }
    .sidebar-foot { padding: 0.75rem; border-top: 1px solid var(--border); }
    .sidebar-foundation { display: block; opacity: 0.9; }
    .sidebar-foundation-logo { width: 100%; max-width: 180px; height: auto; display: block; }
    .main-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
    .topbar {
      display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border); background: var(--bg2); position: sticky; top: 0; z-index: 30;
    }
    .topbar-titles { flex: 1; min-width: 0; }
    .page-title-row { margin: 0; font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 0.35rem; }
    .page-sub { margin: 0.15rem 0 0; font-size: 0.82rem; color: var(--muted); }
    .content { flex: 1; padding: 1rem; max-width: 1180px; margin: 0 auto; width: 100%; }
    .footer {
      margin-top: auto; padding: 0.85rem 1rem; border-top: 1px solid var(--border); color: var(--muted);
      font-size: 0.85rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem;
      background: var(--bg2);
    }
    .footer-version { font-family: ui-monospace, monospace; font-size: 0.78rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; margin-bottom: 1rem; }
    .card h2 { margin: 0 0 0.65rem; font-size: 1.05rem; display: flex; align-items: center; gap: 0.35rem; }
    .grid-kpi { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.65rem; }
    .kpi {
      background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; padding: 0.65rem 0.75rem;
    }
    .kpi-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    .kpi-value { font-size: 1.18rem; font-weight: 700; margin-top: 0.2rem; color: var(--text); word-break: break-word; }
    .kpi-value.accent { color: var(--doge); }
    .kpi-value.ok { color: var(--ok); }
    .muted { color: var(--muted); font-size: 0.86rem; }
    .mono { font-family: ui-monospace, Consolas, monospace; font-size: 0.82rem; word-break: break-all; }
    .field { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 0.75rem; }
    .field-label { font-size: 0.82rem; color: var(--muted); }
    .input-modern {
      width: 100%; padding: 0.6rem 0.75rem; border-radius: 10px; border: 1px solid var(--border);
      background: var(--input-bg); color: var(--text); font: inherit;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.25rem;
      padding: 0.55rem 0.9rem; border-radius: 10px; border: 1px solid var(--border); background: #1a2638;
      color: var(--text); font: inherit; cursor: pointer;
    }
    .btn.primary { background: linear-gradient(135deg, var(--doge), #e6a317); color: #1a1408; border-color: transparent; font-weight: 700; }
    .btn:hover { filter: brightness(1.06); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-top: 0.5rem; }
    .badge { display: inline-block; padding: 0.12rem 0.45rem; border-radius: 999px; font-size: 0.72rem; border: 1px solid var(--border); }
    .badge-pq { border-color: rgba(242, 203, 44, 0.55); color: var(--doge); }
    .badge-ok { border-color: var(--ok); color: var(--ok); }
    .badge-warn { border-color: #ffb347; color: #ffb347; }
    .badge-bad { border-color: var(--danger); color: #ff9b9b; }
    table.data { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    table.data th, table.data td { border-bottom: 1px solid var(--border); padding: 0.45rem 0.35rem; text-align: left; vertical-align: top; }
    table.data th { color: var(--muted); font-weight: 600; font-size: 0.78rem; }
    .tx-row { cursor: pointer; }
    .tx-row:hover { background: rgba(212, 184, 74, 0.06); }
    .err-banner { background: rgba(196, 76, 76, 0.15); border: 1px solid rgba(196, 76, 76, 0.45); color: #ffc8c8; border-radius: 12px; padding: 0.75rem; margin-bottom: 1rem; }
    .link-row { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.5rem; }
    pre.json { background: #0a1018; border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem; overflow: auto; max-height: 52vh; font-size: 0.78rem; }
    .mobile-menu-btn { display: none; }
    @media (max-width: 900px) {
      .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 50; transform: translateX(-102%); transition: transform 0.2s; box-shadow: 4px 0 24px rgba(0,0,0,0.4); }
      .sidebar.open { transform: translateX(0); }
      .mobile-menu-btn { display: inline-flex; }
    }
    .backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }
    .backdrop.show { display: block; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
  </style>
</head>
<body>
  <div class="backdrop" id="sidebar-backdrop" aria-hidden="true"></div>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Explorer navigation">
      <div class="sidebar-brand">
        <img src="/logo.png" alt="" class="sidebar-logo" width="36" height="36" />
        <div class="sidebar-titles">
          <span class="sidebar-name">Quantum Explorer</span>
          <span class="sidebar-sub">Post-quantum aware</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <button type="button" class="nav-item active" data-route="home">
          <span class="material-symbols-outlined nav-ico" aria-hidden="true">explore</span>
          <span>Home</span>
        </button>
        <button type="button" class="nav-item" data-route="mempool">
          <span class="material-symbols-outlined nav-ico" aria-hidden="true">pending</span>
          <span>Mempool</span>
        </button>
        <button type="button" class="nav-item" data-route="api">
          <span class="material-symbols-outlined nav-ico" aria-hidden="true">api</span>
          <span>Public API</span>
        </button>
      </nav>
      <div class="sidebar-foot">
        <a class="sidebar-foundation" href="https://foundation.dogecoin.com/" target="_blank" rel="noopener noreferrer" title="Dogecoin Foundation">
          <img src="https://lib.dogecoin.org/img/dogecoin-foundation.svg" alt="Dogecoin Foundation" class="sidebar-foundation-logo" />
        </a>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <button type="button" class="btn mobile-menu-btn" id="btn-sidebar" aria-label="Open menu">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <div class="topbar-titles">
          <h1 class="page-title-row" id="page-title">
            <span class="material-symbols-outlined icon-inline" id="page-ico" aria-hidden="true">explore</span>
            <span id="page-title-text">Dashboard</span>
          </h1>
          <p class="page-sub" id="page-sub">Dogecoin Core + local index · Phase-1 PQ commitments (BIP draft)</p>
        </div>
      </header>

      <main class="content" id="main"></main>

      <footer class="footer">
        <span>Coded with love to all Dogecoin Community</span>
        <span class="footer-version" id="footer-version" title="Quantum Explorer">—</span>
      </footer>
    </div>
  </div>

  <script>
(function () {
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function satsToDoge(sats) {
    const n = Number(sats);
    if (!Number.isFinite(n)) return '—';
    return (n / 1e8).toLocaleString(undefined, { maximumFractionDigits: 8 });
  }

  function fmtTimeUnix(ts) {
    const n = Number(ts);
    if (!Number.isFinite(n)) return '—';
    return new Date(n * 1000).toISOString().replace('T', ' ').replace(/\.\d{3}Z$/, ' UTC');
  }

  function hashRoute() {
    const h = (location.hash || '#/').replace(/^#/, '') || '/';
    const parts = h.split('/').filter(Boolean);
    return { parts, raw: h };
  }

  async function api(path) {
    const r = await fetch(path, { headers: { Accept: 'application/json' } });
    const j = await r.json().catch(function () { return { error: 'bad json', status: r.status }; });
    if (!r.ok) throw new Error(j.error || j.message || ('HTTP ' + r.status));
    return j;
  }

  const main = $('#main');
  const sidebar = $('#sidebar');
  const backdrop = $('#sidebar-backdrop');
  var explorerCfg = { block_decode_limit_default: 200, mempool_recent_limit: 25 };
  function loadExplorerConfig() {
    return api('/api/public/explorer-config').then(function (c) {
      explorerCfg = c || explorerCfg;
    }).catch(function () { /* keep defaults */ });
  }

  function closeSidebar() {
    sidebar.classList.remove('open');
    backdrop.classList.remove('show');
  }

  $('#btn-sidebar').addEventListener('click', function () {
    sidebar.classList.toggle('open');
    backdrop.classList.toggle('show');
  });
  backdrop.addEventListener('click', closeSidebar);

  function setNav(route) {
    $$('.nav-item').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-route') === route);
    });
  }

  function setTitle(title, ico, sub) {
    $('#page-title-text').textContent = title;
    $('#page-ico').textContent = ico || 'explore';
    if (sub) $('#page-sub').textContent = sub;
  }

  function pqBadge(state) {
    const s = String(state || '').toLowerCase();
    if (s === 'quantum') return '<span class="badge badge-pq">PQ</span>';
    if (s === 'invalid-quantum') return '<span class="badge badge-bad">PQ invalid</span>';
    return '<span class="badge badge-warn">Standard</span>';
  }

  async function viewHome() {
    setNav('home');
    setTitle('Dashboard', 'space_dashboard', 'Indexed metrics + Core live stats (one fast request)');
    main.innerHTML = '<p class="muted">Loading dashboard…</p>';
    try {
      const d = await api('/api/public/dashboard');
      $('#footer-version').textContent = 'v' + esc(d.app_version || '—');
      const rows = (d.indexer && d.indexer.rows) || {};
      const pq = d.pq_totals || {};
      const roles = d.pq_phase1_roles || {};
      const mem = (d.core_live && d.core_live.mempoolinfo) || {};
      const mempoolTx = mem.size != null ? mem.size : (mem.loaded != null ? mem.loaded : '—');
      const hps = d.core_live && d.core_live.network_hash_ps;
      const bc = (d.core_live && d.core_live.blockchaininfo) || {};
      const tipH = bc.blocks != null ? bc.blocks : (d.indexer && d.indexer.tip_height);
      const best = bc.bestblockhash || '';
      const circ = d.circulation || {};
      const circStr = circ.available ? circ.total_doge : (circ.note ? '—' : '—');
      const circHint = circ.available ? '' : ('<div class="muted" style="margin-top:0.25rem;font-size:0.72rem">' + esc(circ.note || '') + '</div>');
      const latest = d.latest_transactions || [];
      const mpre = d.mempool_recent || [];
      var mempoolHtml = '<div class="card"><h2><span class="material-symbols-outlined icon-inline">pending</span> Mempool sample (Core)</h2>';
      if (!mpre.length) {
        mempoolHtml += '<p class="muted">No mempool rows (Core offline, empty pool, or verbose mempool not available).</p></div>';
      } else {
        mempoolHtml += '<p class="muted">Newest-first by mempool <span class="mono">time</span> when reported by the node.</p><table class="data"><thead><tr><th>Pool time</th><th>Txid</th><th>vsize</th><th>fee (native)</th></tr></thead><tbody id="mp-body"></tbody></table></div>';
      }

      main.innerHTML =
        '<div class="card"><h2><span class="material-symbols-outlined icon-inline">bolt</span> Network overview</h2>' +
        '<div class="grid-kpi">' +
        '<div class="kpi"><div class="kpi-label">Mempool transactions</div><div class="kpi-value accent">' + esc(mempoolTx) + '</div></div>' +
        '<div class="kpi"><div class="kpi-label">Latest block (Core)</div><div class="kpi-value">' + esc(tipH != null ? tipH : '—') + '</div>' +
        (best ? '<div class="muted mono" style="margin-top:0.25rem;font-size:0.75rem">' + esc(best) + '</div>' : '') + '</div>' +
        '<div class="kpi"><div class="kpi-label">Network hashrate (120 blk est.)</div><div class="kpi-value ok">' +
        (hps != null ? esc(Number(hps).toExponential(3)) + ' H/s' : '—') + '</div></div>' +
        '<div class="kpi"><div class="kpi-label">Indexed addresses</div><div class="kpi-value">' + esc(rows.addresses != null ? rows.addresses : '—') + '</div></div>' +
        '<div class="kpi"><div class="kpi-label">Ð in circulation (UTXO set)</div><div class="kpi-value">' + esc(circStr) + '</div>' +
        (circ.cached === true ? '<div class="muted" style="margin-top:0.2rem;font-size:0.72rem">cached</div>' : '') +
        (circ.stale ? '<div class="muted" style="margin-top:0.2rem;font-size:0.72rem">refresh pending</div>' : '') +
        circHint + '</div>' +
        '<div class="kpi"><div class="kpi-label">Indexed blocks</div><div class="kpi-value">' + esc(rows.blocks != null ? rows.blocks : '—') + '</div></div>' +
        '<div class="kpi"><div class="kpi-label">Indexed transactions</div><div class="kpi-value">' + esc(rows.txs != null ? rows.txs : '—') + '</div></div>' +
        '</div></div>' +

        '<div class="card"><h2><span class="material-symbols-outlined icon-inline">shield_lock</span> Post-quantum (Phase 1)</h2>' +
        '<p class="muted" style="margin-top:0">Canonical OP_RETURN commitments (TX_C) and optional P2SH carrier reveals (TX_R). ' +
        'Verify interactively on <a href="' + esc(d.qdv_verify || 'https://suchquantum.com/qdv/') + '" target="_blank" rel="noopener">QDVerify</a> · ' +
        'BIP draft: <a href="' + esc(d.spec_bip || '#') + '" target="_blank" rel="noopener">libdogecoin spec</a>.</p>' +
        '<div class="grid-kpi" style="margin-top:0.75rem">' +
        '<div class="kpi"><div class="kpi-label">PQ rows (indexed)</div><div class="kpi-value accent">' + esc(pq.quantum != null ? pq.quantum : '—') + '</div></div>' +
        '<div class="kpi"><div class="kpi-label">Committed (TX_C)</div><div class="kpi-value ok">' + esc(roles.committed_tx_c != null ? roles.committed_tx_c : '—') + '</div></div>' +
        '<div class="kpi"><div class="kpi-label">Revealed (TX_R)</div><div class="kpi-value ok">' + esc(roles.revealed_tx_r != null ? roles.revealed_tx_r : '—') + '</div></div>' +
        '<div class="kpi"><div class="kpi-label">Invalid PQ markers</div><div class="kpi-value">' + esc(pq.invalid_quantum != null ? pq.invalid_quantum : '—') + '</div></div>' +
        '</div></div>' +

        '<div class="card"><h2><span class="material-symbols-outlined icon-inline">search</span> Search</h2>' +
        '<p class="muted">Block height, block hash, Dogecoin address, or transaction id.</p>' +
        '<form id="form-search" class="toolbar" style="margin-top:0.5rem">' +
        '<input class="input-modern" id="search-q" placeholder="e.g. 6093890 or D… or txid…" style="flex:1;min-width:200px" />' +
        '<button type="submit" class="btn primary"><span class="material-symbols-outlined btn-ico">search</span> Go</button></form></div>' +

        '<div class="card"><h2><span class="material-symbols-outlined icon-inline">swap_horiz</span> Latest 10 transactions (indexed)</h2>' +
        '<table class="data"><thead><tr><th>Time</th><th>Txid</th><th>Block</th><th>Out (Ð)</th><th>PQ</th></tr></thead><tbody id="latest-tx-body"></tbody></table></div>' +
        mempoolHtml;

      const mpb = $('#mp-body');
      if (mpb) {
        mpb.innerHTML = mpre.map(function (r) {
          const ts = r.mempool_time ? fmtTimeUnix(r.mempool_time) : '—';
          return '<tr class="tx-row" data-txid="' + esc(r.txid) + '"><td>' + esc(ts) + '</td><td class="mono">' + esc(r.txid) + '</td><td>' + esc(r.vsize != null ? r.vsize : '—') + '</td><td>' + esc(r.fee != null ? r.fee : '—') + '</td></tr>';
        }).join('');
        $$('.tx-row', mpb).forEach(function (tr) {
          tr.addEventListener('click', function () {
            location.hash = '#/tx/' + tr.getAttribute('data-txid');
          });
        });
      }
      const tb = $('#latest-tx-body');
      if (latest.length === 0) {
        tb.innerHTML = '<tr><td colspan="5" class="muted">No indexed transactions yet.</td></tr>';
      } else {
        tb.innerHTML = latest.map(function (r) {
          const id = String(r.txid || '');
          const hint = r.pq_carrier_role_hint ? ' <span class="muted mono">(' + esc(r.pq_carrier_role_hint) + ')</span>' : '';
          return '<tr class="tx-row" data-txid="' + esc(id) + '"><td>' + esc(fmtTimeUnix(r.time_unix)) + '</td><td class="mono">' + esc(id) + '</td><td>' + esc(r.block_height) + '</td><td>' + esc(satsToDoge(r.value_out_sats)) + '</td><td>' + pqBadge(r.quantum_state) + hint + '</td></tr>';
        }).join('');
        $$('.tx-row', tb).forEach(function (tr) {
          tr.addEventListener('click', function () {
            location.hash = '#/tx/' + tr.getAttribute('data-txid');
          });
        });
      }

      $('#form-search').addEventListener('submit', function (ev) {
        ev.preventDefault();
        const q = ($('#search-q').value || '').trim();
        if (!q) return;
        doSearch(q);
      });
    } catch (e) {
      main.innerHTML = '<div class="err-banner">' + esc(e.message || e) + '</div>';
    }
  }

  async function doSearch(q) {
    setTitle('Search', 'search', q);
    setNav('');
    main.innerHTML = '<p class="muted">Searching…</p>';
    closeSidebar();
    try {
      const out = await api('/api/public/search?q=' + encodeURIComponent(q) + '&limit=40');
      const kind = out.kind || '';
      if (kind === 'block_height' || kind === 'block_hash') {
        location.hash = '#/block/' + encodeURIComponent(String(out.block && out.block.height != null ? out.block.height : q));
        return;
      }
      if (kind === 'txid') {
        location.hash = '#/tx/' + encodeURIComponent(q.toLowerCase());
        return;
      }
      if (kind === 'address') {
        location.hash = '#/address/' + encodeURIComponent(q);
        return;
      }
      let html = '<div class="card"><h2>Results</h2><p class="muted">kind: ' + esc(kind) + '</p>';
      if (out.results && out.results.length) {
        html += '<ul class="mono">';
        html += out.results.slice(0, 40).map(function (r) {
          return '<li>' + esc(JSON.stringify(r).slice(0, 240)) + '</li>';
        }).join('');
        html += '</ul>';
      } else {
        html += '<p>No matches.</p>';
      }
      html += '</div>';
      main.innerHTML = html;
    } catch (e) {
      main.innerHTML = '<div class="err-banner">' + esc(e.message || e) + '</div>';
    }
  }

  async function viewBlock(token) {
    setNav('');
    setTitle('Block', 'cube', token);
    main.innerHTML = '<p class="muted">Loading block…</p>';
    closeSidebar();
    const decLim = Math.min(500, Math.max(1, parseInt(String(explorerCfg.block_decode_limit_default || 200), 10) || 200));
    const q = /^[0-9]+$/.test(token) ? ('height=' + encodeURIComponent(token)) : ('hash=' + encodeURIComponent(token));
    try {
      const b = await api('/api/public/block?' + q + '&decode_limit=' + decLim);
      const blk = b.block || {};
      const txs = b.associated_transactions || [];
      const h = blk.height != null ? blk.height : token;
      const when = blk.timestamp || (blk.time_unix != null ? fmtTimeUnix(blk.time_unix) : '—');
      main.innerHTML =
        '<div class="card"><h2>Block ' + esc(h) + '</h2>' +
        '<p class="mono muted">hash: ' + esc(blk.hash || '') + '</p>' +
        '<p class="muted">time: ' + esc(when) + ' · txs: ' + esc(b.tx_count != null ? b.tx_count : txs.length) + '</p>' +
        '<p class="muted">Decoded scripts for the first ' + esc(decLim) + ' transactions (see <span class="mono">decode_limit</span>).</p></div>' +
        '<div class="card"><h2>Transactions</h2><table class="data"><thead><tr><th>Txid</th><th>PQ state</th><th>Value out (Ð)</th><th>Ins / outs</th></tr></thead><tbody id="blk-tb"></tbody></table></div>';
      const tb = $('#blk-tb');
      tb.innerHTML = txs.map(function (row) {
        const id = String(row.txid || '').toLowerCase();
        const st = row.quantum_state || (row.pq_tx && row.pq_tx.quantum_state) || '';
        const dec = row.decode || {};
        const ins = (dec.inputs && dec.inputs.length) || '—';
        const outs = (dec.outputs && dec.outputs.length) || '—';
        const vdoge = dec.output_total_doge != null ? dec.output_total_doge : satsToDoge(row.value_out_sats);
        return '<tr class="tx-row" data-txid="' + esc(id) + '"><td class="mono">' + esc(id) + '</td><td>' + pqBadge(st) + '</td><td>' + esc(vdoge) + '</td><td>' + esc(ins) + ' / ' + esc(outs) + '</td></tr>';
      }).join('');
      $$('.tx-row', tb).forEach(function (tr) {
        tr.addEventListener('click', function () {
          location.hash = '#/tx/' + tr.getAttribute('data-txid');
        });
      });
    } catch (e) {
      main.innerHTML = '<div class="err-banner">' + esc(e.message || e) + '</div>';
    }
  }

  function renderOutputRow(o) {
    const opret = o.kind_detail === 'op_return'
      ? '<div class="muted" style="margin-top:0.25rem">OP_RETURN hex: <span class="mono">' + esc(o.op_return_hex || '') + '</span><br>preview: ' + esc(o.op_return_preview || '') + '</div>'
      : '';
    const pqhint = o.pq_hint_tag ? '<span class="badge badge-pq">' + esc(o.pq_hint_tag) + '</span> ' : '';
    return '<tr><td>' + esc(o.n) + '</td><td>' + esc(satsToDoge(o.value_sats)) + '</td><td>' + pqhint + esc(o.script_kind || '') +
      '</td><td class="mono">' + esc(o.address || '') + '<br><span class="muted">' + esc(o.script_hex || '').slice(0, 120) + (String(o.script_hex || '').length > 120 ? '…' : '') + '</span>' + opret + '</td></tr>';
  }

  function renderInputRow(i) {
    const prev = i.prev_output || {};
    const addr = prev.address ? '<span class="mono">' + esc(prev.address) + '</span> · ' + esc(satsToDoge(prev.value_sats)) + ' Ð' : '<span class="muted">prevout not indexed</span>';
    return '<tr><td>' + esc(i.n) + '</td><td class="mono">' + esc(i.prev_txid) + ':' + esc(i.prev_vout) + '</td><td>' + addr +
      '</td><td class="mono">' + esc((i.script_sig_hex || '').slice(0, 160)) + (String(i.script_sig_hex || '').length > 160 ? '…' : '') + '<div class="muted">' + esc(i.script_sig_asm || '') + '</div></td></tr>';
  }

  async function viewTx(id) {
    setNav('');
    setTitle('Transaction', 'article', id);
    main.innerHTML = '<p class="muted">Loading transaction…</p>';
    closeSidebar();
    try {
      const d = await api('/api/public/tx?txid=' + encodeURIComponent(id));
      const tx = d.tx || {};
      const pq = d.pq_verification || {};
      const dec = pq.decode || {};
      const core = d.core || {};
      const strict = pq.strict || (dec.pq_strict || {});
      const car = pq.carrier_phase1 || {};
      const fal = car.falcon_crypto_verify || {};

      let badges = '';
      if (tx.quantum_state === 'quantum' || strict.valid || car.verified) badges += '<span class="badge badge-pq">Post-quantum</span> ';
      if (strict.valid) badges += '<span class="badge badge-ok">Phase-1 OP_RETURN</span> ';
      if (car.verified) badges += '<span class="badge badge-ok">Carrier verified</span> ';
      if (fal.status && String(fal.status).toLowerCase() !== 'skipped') badges += '<span class="badge">' + esc(fal.status) + '</span> ';

      const outs = (dec.outputs || []).map(renderOutputRow).join('');
      const ins = (dec.inputs || []).map(renderInputRow).join('');

      main.innerHTML =
        '<div class="card"><h2>Summary</h2>' + badges +
        '<p class="mono" style="margin:0.5rem 0">' + esc(tx.txid || id) + '</p>' +
        '<p class="muted">Block ' + esc(core.block_height) + ' · ' + esc(core.timestamp || '') + '</p>' +
        '<div class="grid-kpi" style="margin-top:0.75rem">' +
        '<div class="kpi"><div class="kpi-label">Size</div><div class="kpi-value">' + esc(dec.size_bytes != null ? dec.size_bytes + ' B' : '—') + '</div></div>' +
        '<div class="kpi"><div class="kpi-label">vsize</div><div class="kpi-value">' + esc(dec.vsize != null ? dec.vsize : '—') + '</div></div>' +
        '<div class="kpi"><div class="kpi-label">Output total</div><div class="kpi-value accent">' + esc(dec.output_total_doge != null ? dec.output_total_doge + ' Ð' : '—') + '</div></div>' +
        '<div class="kpi"><div class="kpi-label">Fee</div><div class="kpi-value">' + esc(dec.fee_sats != null ? satsToDoge(dec.fee_sats) + ' Ð' : (dec.fee_note || 'needs prevouts')) + '</div></div>' +
        '</div></div>' +

        '<div class="card"><h2>Strict PQ check</h2><p class="muted">' + esc(strict.reason || '') + '</p>' +
        (strict.evidence && strict.evidence.length ? '<ul class="mono muted">' + strict.evidence.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>' : '') +
        '</div>' +

        (Object.keys(car).length ? '<div class="card"><h2>Carrier Phase 1</h2><pre class="json">' + esc(JSON.stringify(car, null, 2)) + '</pre></div>' : '') +

        '<div class="card"><h2>Inputs</h2><table class="data"><thead><tr><th>n</th><th>Prevout</th><th>Value / address</th><th>scriptSig</th></tr></thead><tbody>' + ins + '</tbody></table></div>' +
        '<div class="card"><h2>Outputs</h2><table class="data"><thead><tr><th>n</th><th>Value (Ð)</th><th>Kind</th><th>Address / script</th></tr></thead><tbody>' + outs + '</tbody></table></div>' +

        '<div class="card"><h2>Raw verification JSON</h2><pre class="json">' + esc(JSON.stringify(pq, null, 2).slice(0, 48000)) + '</pre></div>';
    } catch (e) {
      main.innerHTML = '<div class="err-banner">' + esc(e.message || e) + '</div>';
    }
  }

  async function viewAddress(addr, offset) {
    setNav('');
    var off = offset || 0;
    var lim = 40;
    setTitle('Address', 'account_balance_wallet', addr + (off ? ' · page ' + (Math.floor(off / lim) + 1) : ''));
    main.innerHTML = '<p class="muted">Loading address history…</p>';
    closeSidebar();
    try {
      const d = await api('/api/public/address?address=' + encodeURIComponent(addr) + '&offset=' + off + '&limit=' + lim);
      const st = d.stats || {};
      const rows = d.transactions || [];
      const hasMore = !!d.has_more;
      const prevOff = off >= lim ? off - lim : 0;
      const nextOff = hasMore ? off + lim : off;
      main.innerHTML =
        '<div class="card"><h2>Address</h2><p class="mono" style="margin:0.25rem 0">' + esc(addr) + '</p>' +
        '<p class="muted">' + esc(st.note || '') + '</p>' +
        '<div class="grid-kpi" style="margin-top:0.75rem">' +
        '<div class="kpi"><div class="kpi-label">Distinct txs</div><div class="kpi-value">' + esc(st.distinct_transactions != null ? st.distinct_transactions : '—') + '</div></div>' +
        '<div class="kpi"><div class="kpi-label">Credited outputs</div><div class="kpi-value">' + esc(st.credited_outputs != null ? st.credited_outputs : '—') + '</div></div>' +
        '<div class="kpi"><div class="kpi-label">Total received (Ð)</div><div class="kpi-value accent">' + esc(satsToDoge(st.total_received_to_address_sats)) + '</div></div>' +
        '<div class="kpi"><div class="kpi-label">Blocks</div><div class="kpi-value">' + esc(st.first_block_height) + ' … ' + esc(st.last_block_height) + '</div></div>' +
        '</div></div>' +
        '<div class="card"><h2>Transactions paying to this address</h2>' +
        '<div class="toolbar" style="margin-bottom:0.75rem">' +
        '<button type="button" class="btn" id="addr-prev"' + (off <= 0 ? ' disabled' : '') + '><span class="material-symbols-outlined btn-ico">chevron_left</span> Newer</button>' +
        '<button type="button" class="btn" id="addr-next"' + (!hasMore ? ' disabled' : '') + '><span class="material-symbols-outlined btn-ico">chevron_right</span> Older</button>' +
        '</div>' +
        '<table class="data"><thead><tr><th>Time</th><th>Block</th><th>Txid</th><th>To address (Ð)</th><th>PQ</th></tr></thead><tbody id="addr-tb"></tbody></table></div>';
      const atb = $('#addr-tb');
      atb.innerHTML = rows.map(function (r) {
        return '<tr class="tx-row" data-txid="' + esc(r.txid) + '"><td>' + esc(fmtTimeUnix(r.time_unix)) + '</td><td>' + esc(r.block_height) + '</td><td class="mono">' + esc(r.txid) + '</td><td>' + esc(satsToDoge(r.value_to_address_sats)) + '</td><td>' + pqBadge(r.quantum_state) + '</td></tr>';
      }).join('');
      $$('.tx-row', atb).forEach(function (tr) {
        tr.addEventListener('click', function () {
          location.hash = '#/tx/' + tr.getAttribute('data-txid');
        });
      });
      var prevBtn = $('#addr-prev');
      var nextBtn = $('#addr-next');
      if (prevBtn) prevBtn.onclick = function () { if (off > 0) location.hash = '#/address/' + encodeURIComponent(addr) + '/' + prevOff; };
      if (nextBtn) nextBtn.onclick = function () { if (hasMore) location.hash = '#/address/' + encodeURIComponent(addr) + '/' + nextOff; };
    } catch (e) {
      main.innerHTML = '<div class="err-banner">' + esc(e.message || e) + '</div>';
    }
  }

  async function viewMempool() {
    setNav('mempool');
    setTitle('Mempool', 'pending', 'Unconfirmed transactions from Dogecoin Core');
    main.innerHTML = '<p class="muted">Loading mempool…</p>';
    closeSidebar();
    try {
      var lim = Math.min(100, Math.max(1, parseInt(String(explorerCfg.mempool_recent_limit || 40), 10) || 40));
      const d = await api('/api/public/mempool-recent?limit=' + lim + '&decode_pq=1');
      const rows = d.rows || [];
      main.innerHTML =
        '<div class="card"><h2>Mempool</h2><p class="muted">PQ column uses Phase-1 strict OP_RETURN scan on raw hex (<span class="mono">decode_pq=1</span>).</p>' +
        '<table class="data"><thead><tr><th>Pool time</th><th>Txid</th><th>vsize</th><th>Fee</th><th>PQ strict</th></tr></thead><tbody id="mpage-tb"></tbody></table></div>';
      const tb = $('#mpage-tb');
      tb.innerHTML = rows.map(function (r) {
        const ts = r.mempool_time ? fmtTimeUnix(r.mempool_time) : '—';
        var pq = '—';
        if (r.pq_strict_valid === true) pq = '<span class="badge badge-pq">yes</span>';
        else if (r.pq_strict_valid === false) pq = '<span class="badge">no</span>';
        return '<tr class="tx-row" data-txid="' + esc(r.txid) + '"><td>' + esc(ts) + '</td><td class="mono">' + esc(r.txid) + '</td><td>' + esc(r.vsize != null ? r.vsize : '—') + '</td><td>' + esc(r.fee != null ? r.fee : '—') + '</td><td>' + pq + '</td></tr>';
      }).join('');
      $$('.tx-row', tb).forEach(function (tr) {
        tr.addEventListener('click', function () {
          location.hash = '#/tx/' + tr.getAttribute('data-txid');
        });
      });
    } catch (e) {
      main.innerHTML = '<div class="err-banner">' + esc(e.message || e) + '</div>';
    }
  }

  function viewApi() {
    setNav('api');
    setTitle('Public API', 'api', 'Rate limits and optional token gates are configured in the admin backoffice.');
    closeSidebar();
    main.innerHTML =
      '<div class="card"><h2>Endpoints</h2>' +
      '<ul class="mono muted" style="line-height:1.7">' +
      '<li><strong>GET</strong> /api/public/dashboard — homepage metrics (fast)</li>' +
      '<li><strong>GET</strong> /api/public/explorer-config — defaults (block decode limit, mempool sample)</li>' +
      '<li><strong>GET</strong> /api/public/status — full status + PQ feed</li>' +
      '<li><strong>GET</strong> /api/public/search?q=…&amp;limit=…</li>' +
      '<li><strong>GET</strong> /api/public/address?address=…&amp;offset=&amp;limit=</li>' +
      '<li><strong>GET</strong> /api/public/mempool-recent?limit=…&amp;decode_pq=1</li>' +
      '<li><strong>GET</strong> /api/public/block?height=… OR &amp;hash=…&amp;decode_limit=…</li>' +
      '<li><strong>GET</strong> /api/public/tx?txid=…</li>' +
      '<li><strong>GET</strong> /api/public/core/recent-txs?limit=…&amp;mode=quantum&amp;lite=1</li>' +
      '</ul>' +
      '<p class="muted">Configure <span class="mono">QE_PUBLIC_RATE_LIMIT</span>, <span class="mono">QE_PUBLIC_API_TOKEN</span>, <span class="mono">QE_PUBLIC_API_ALLOWLIST</span>, and protected paths via <span class="mono">/admin/&lt;token&gt;</span>.</p></div>';
  }

  function route() {
    const { parts } = hashRoute();
    if (parts[0] === 'tx' && parts[1]) viewTx(decodeURIComponent(parts[1].toLowerCase()));
    else if (parts[0] === 'block' && parts[1]) viewBlock(decodeURIComponent(parts[1]));
    else if (parts[0] === 'address' && parts[1]) {
      var aoff = 0;
      if (parts[2] != null && /^\d+$/.test(parts[2])) aoff = parseInt(parts[2], 10);
      viewAddress(decodeURIComponent(parts[1]), aoff);
    } else if (parts[0] === 'mempool') viewMempool();
    else if (parts[0] === 'api') viewApi();
    else viewHome();
  }

  $$('.nav-item').forEach(function (b) {
    b.addEventListener('click', function () {
      const r = b.getAttribute('data-route');
      if (r === 'home') location.hash = '#/';
      else if (r === 'mempool') location.hash = '#/mempool';
      else if (r === 'api') location.hash = '#/api';
    });
  });

  window.addEventListener('hashchange', route);
  loadExplorerConfig().finally(function () { route(); });
})();
  </script>
</body>
</html>
